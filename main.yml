---
- name: Configure Internet Pi.
  hosts: internet_pi
  become: true

  pre_tasks:
    - name: Load configuration (with defaults from example file).
      ansible.builtin.include_vars: "{{ item }}"
      loop:
        - example.config.yml
        - config.yml

    - name: Ensure apt cache is up to date.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when:
        - ansible_facts.os_family == "Debian"

    - name: Ensure pacman cache is up to date
      community.general.pacman:
        update_cache: true
      when:
        - ansible_facts.os_family == "Archlinux"

    - name: Ensure yq is installed (Debian).
      ansible.builtin.apt:
        name: yq
        state: present
      when:
        - ansible_facts.os_family == "Debian"

    - name: Ensure yq is installed (Archlinux).
      community.general.pacman:
        name: yq
        state: present
      when:
        - ansible_facts.os_family == "Archlinux"

  handlers:
    - name: Include handlers.
      ansible.builtin.import_tasks: tasks/handlers.yml

  tasks:
    - name: Setup Docker.
      ansible.builtin.import_tasks: tasks/docker.yml

    - name: Set up Internet Monitoring.
      ansible.builtin.import_tasks: tasks/internet-monitoring.yml
      when: monitoring_enable

    - name: Set up Pi Hole.
      ansible.builtin.import_tasks: tasks/pi-hole.yml
      when: pihole_enable

    - name: Create weekly container update cron job.
      ansible.builtin.cron:
        name: "Weekly docker compose update"
        minute: "0"
        hour: "0"
        weekday: "1"
        job: "{{ config_dir }}/update.sh"
